[package]
name = "simple-notifier"
version = "0.1.0"
edition = "2024"

[dependencies]
ureq = "3"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "rustls-tls"] }
rand = "0.8"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
nix = { version = "0", features = ["time"] }
